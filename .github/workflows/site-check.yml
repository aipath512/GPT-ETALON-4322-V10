name: SCARA C4322 — validare site-uri de familie
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all pages, catalogs, assets and interaction wiring
        run: node --test tests/c4322-dictionar.test.mjs tests/c4322-sites.test.mjs etalons/C4322/C4322.test.mjs
